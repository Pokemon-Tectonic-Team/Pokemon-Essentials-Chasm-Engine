name: Tests

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 2
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: ruby
                  bundler-cache: true
            - name: Check syntax
              id: syntax
              shell: bash
              run:
                  git ls-files -z 'Plugins/*.rb' | xargs -0 -n1 -P4 ruby -c >
                  /dev/null
            - name: Run tests
              id: tests
              if: ${{ !cancelled() }}
              env:
                  COVERAGE: all
              run: bundle exec minitest Tests
            - name: Build PR report
              if: ${{ !cancelled() && github.event_name == 'pull_request' }}
              continue-on-error: true
              env:
                  SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
                  TESTS_OUTCOME: ${{ steps.tests.outcome }}
                  RUN_URL:
                      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
                      github.run_id }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: bundle exec ruby .github/scripts/pr_report.rb pr-report
            - uses: actions/upload-artifact@v7
              if: ${{ !cancelled() && github.event_name == 'pull_request' }}
              with:
                  name: pr-report
                  path: pr-report/
                  retention-days: 7
