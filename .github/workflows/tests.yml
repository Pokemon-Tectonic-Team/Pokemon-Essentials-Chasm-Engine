name: Tests

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: ruby
                  bundler-cache: true
            - name: Check syntax
              shell: bash
              run:
                  git ls-files -z 'Plugins/*.rb' | xargs -0 -n1 -P4 ruby -c >
                  /dev/null
            - name: Run tests
              run: bundle exec minitest Tests
